# Drop-in for jarvis.service: /etc/systemd/system/jarvis.service.d/capabilities.conf
#
# DO NOT INSTALL against a checkout the service user can write. The daemon
# restarts itself when killed, so anything running as that user could edit
# the code, kill the daemon and return holding these capabilities;
# CAP_SYS_PTRACE into a root process is root. Clearing the ambient set
# protects children, not the daemon's own code. Safe only when ExecStart runs
# a root-owned install under `python3 -I` (cwd and user site-packages are
# ignored). The backdoor audit reports a privileged unit running
# user-writable code. Not installed by install.sh.
#
# Least-privilege visibility. The daemon stays its own unprivileged account; these three
# capabilities let it read what an unprivileged monitor cannot:
#
#   CAP_SYS_PTRACE       other accounts' /proc/<pid>/{fd,maps,environ,exe}
#                        (injected code in root daemons, sockets no visible
#                        process owns)
#   CAP_DAC_READ_SEARCH  root-only files such as /sys/kernel/tracing
#   CAP_SYSLOG           kernel addresses in /proc/kallsyms and /proc/modules
#
# They are powerful: read any file, inspect any process. Not requested:
# CAP_SYS_ADMIN (eBPF enumeration) and CAP_NET_ADMIN (netfilter), which are
# near-root. The daemon clears the ambient set at startup
# (jarvis/platform/privilege.py), so nothing it launches inherits these.
[Service]
AmbientCapabilities=CAP_SYS_PTRACE CAP_DAC_READ_SEARCH CAP_SYSLOG
