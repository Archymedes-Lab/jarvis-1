# Drop-in for journald — /etc/systemd/journald.conf.d/journald-sysmon.conf
#
#   sudo install -Dm644 systemd/journald-sysmon.conf \
#        /etc/systemd/journald.conf.d/journald-sysmon.conf
#   sudo systemctl restart systemd-journald
#
# Sysmon for Linux emits tens of thousands of events an hour on a busy box.
# With the stock journal that rotates them out in about two hours — shorter
# than the gap a suspended WSL VM, a stopped daemon, or a long `intel` refresh
# can open, and once an event has rotated out `sysmon-linux` can never read it.
# (The collector now reports when this happens rather than losing the window
# silently, but the fix is headroom.)
#
# This raises the journal cap enough to hold ~2 days of that volume. It is a
# real disk commitment — up to 6 GB under /var/log/journal — so it is opt-in,
# not applied by install.sh. Lower SystemMaxUse if the box is tight on disk
# and accept the shorter window.

[Journal]
SystemMaxUse=6G
SystemKeepFree=2G
MaxRetentionSec=2day
