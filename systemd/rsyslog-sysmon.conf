# /etc/rsyslog.d/10-jarvis-sysmon.conf
#
#   sudo install -Dm644 systemd/rsyslog-sysmon.conf /etc/rsyslog.d/10-jarvis-sysmon.conf
#   sudo systemctl restart rsyslog
#   sudo rm -f /var/log/syslog.[0-9]*        # the rotated copies, 5+ GB on 2026-10-23
#
# Sysmon for Linux writes every event to the journal, where JARVIS's
# sysmon-linux collector reads it (and journald-sysmon.conf bounds it).
# rsyslog then copies the same stream into /var/log/syslog: on 2026-10-23
# that copy was 9.2 GB (syslog 3.9 GB, syslog.1 4.0 GB, rotated archives),
# the single largest growth inside the WSL image. Nothing reads it.
#
# This stops the copy at the source. Every other program's messages still
# reach /var/log/syslog unchanged. The journal keeps the evidence.
:programname, isequal, "sysmon" stop
