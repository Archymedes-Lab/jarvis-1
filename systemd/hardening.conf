# Drop-in for jarvis.service — /etc/systemd/system/jarvis.service.d/hardening.conf
#
# Everything here answers one question: what can stop this service, and how do
# we take that away?
#
#   * Restart=always already covers a crash. It does NOT cover a process that
#     is alive and doing nothing, which is the failure that actually happened
#     on this machine — the interop socket died and every collector kept
#     "succeeding" against a stale snapshot. WatchdogSec closes that: the
#     daemon pings systemd only while its scheduler is making progress, and a
#     missed ping is a kill and a clean restart.
#
#   * StartLimitIntervalSec=0 is the important line. By default systemd gives
#     up on a unit that restarted too often in too short a window and leaves it
#     dead — "start request repeated too quickly". For an ordinary service that
#     is sensible backpressure. For a security monitor it converts a transient
#     crash loop into permanent silence, so the rate limiter is switched off
#     entirely: this unit retries forever.
#
#   * Restart=always plus RestartSec=5 means the longest window in which
#     nothing is watching is five seconds.

[Unit]
# Never stop trying. 0 disables start-rate limiting outright.
StartLimitIntervalSec=0
StartLimitBurst=0

[Service]
Restart=always
RestartSec=5

# Kill and restart if the scheduler stops making progress.
#
# 15 minutes, not 5. The `intel` job makes networked LLM calls and can honestly
# take minutes; a tighter watchdog would kill a healthy daemon mid-refresh and
# turn this hardening into an outage of its own. Responsiveness does not suffer
# because this is the *backstop*: jarvis-selfcheck.timer independently notices
# a stalled scheduler within ~7 minutes and restarts it. This catches the case
# where that timer is also gone.
WatchdogSec=900
NotifyAccess=main

# Do not let a slow shutdown hold the restart back.
TimeoutStopSec=20

# A monitor that gets OOM-killed is the failure it exists to prevent.
OOMScoreAdjust=-900
OOMPolicy=continue

# Win CPU and IO contention rather than losing it.
CPUWeight=10000
IOWeight=10000
Nice=-10
