# Drop-in for jarvis.service — /etc/systemd/system/jarvis.service.d/service-user.conf
#
# PROTECTION-REVIEW-2026-10-21 F2: the daemon used to run as the account it
# protects, so anything running as that account could stop it, freeze it, or
# rewrite its store, config and acknowledgements, and read its API token. This
# drop-in moves the daemon to its own system user. Its state is
# /var/lib/jarvis/.jarvis (HOME=/var/lib/jarvis, so every ~/.jarvis path in the
# code resolves there), 0700, every file 0600, all owned by jarvis. The daemon
# refuses to start if that directory is open to other accounts
# (jarvis/core/statedir.py). Installed by scripts/repair/install-service-user.sh,
# which migrates the state and refuses to switch unless
# Windows interop works for the new user (the daemon is nothing without
# PowerShell). Switch-over and rollback: docs/guides/SERVICE-ACCOUNT.md.
#
# What stays open by design: /mnt/c (the Windows disk is the thing being
# watched; DrvFs grants the new user read access and the specific writable
# folders JARVIS owns on the Windows side), and the loopback API, where every
# route but liveness needs a credential.
[Service]
User=jarvis
Group=jarvis
Environment=HOME=/var/lib/jarvis
# The owner's Linux account is not handed the dashboard cookie (it cannot read
# the token file, so that was a grant to every process it runs: QC blocker 4);
# it pairs its browser through /pair, like every Windows program (web/token.py).
UMask=0077
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/var/lib/jarvis /run/jarvis /mnt/c/Users/chris/AppData/Local/Jarvis /mnt/c/ProgramData/Jarvis/Sensor/acks
RuntimeDirectory=jarvis
RuntimeDirectoryMode=0750
StateDirectory=jarvis
StateDirectoryMode=0700
NoNewPrivileges=yes
PrivateTmp=yes
# The capability set the release already asks for (read the Windows disk,
# ptrace-free process inspection, syslog); nothing beyond it.
AmbientCapabilities=CAP_DAC_READ_SEARCH CAP_SYS_PTRACE CAP_SYSLOG
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_SYS_PTRACE CAP_SYSLOG
