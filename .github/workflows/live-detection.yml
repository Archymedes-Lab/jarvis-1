name: Live detection run

# Started by a person, never by a push. On a GitHub-hosted runner (a virtual machine
# that is destroyed afterwards) a fixed list of local, reversible attacker actions is
# carried out for real, and reviewed Linux observation collectors report what they saw
# (scripts/security/live_bench.py). Nothing is downloaded by the actions and nothing
# leaves the runner. A measurement: it does not gate a release. CI minutes are a
# budget, so this is not scheduled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Runtime dependencies (pinned by hash)
        run: python -m pip install --disable-pip-version-check --require-hashes -r release/requirements-runtime.txt
      - name: Real actions, then reviewed collectors
        shell: bash
        run: |
          set -euo pipefail
          # No external network in the attack/collector phase. Dependencies were installed above.
          sudo unshare --net -- env JARVIS_ARENA_SANDBOX=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" "$(command -v python)" scripts/security/live_bench.py --json "$RUNNER_TEMP/live.json" 2>&1 | tee "$RUNNER_TEMP/live.txt"
          test -s "$RUNNER_TEMP/live.json"
          { echo '```'; cat "$RUNNER_TEMP/live.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurement, including failed runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-detection-evidence
          path: |
            ${{ runner.temp }}/live.json
            ${{ runner.temp }}/live.txt
          retention-days: 14

  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      JARVIS_ARENA_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r release/requirements-runtime.txt
      - name: Prepare disposable telemetry and scoped network isolation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/security/windows_bench_setup.ps1
      - name: Real Windows state actions and native log delivery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & python scripts/security/windows_bench.py --json "$env:RUNNER_TEMP/windows-live.json" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-live.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Windows benchmark incomplete or failed' }
          if (-not (Test-Path "$env:RUNNER_TEMP/windows-live.json")) { throw 'Measurement report missing' }
          if ((Get-Item "$env:RUNNER_TEMP/windows-live.json").Length -eq 0) { throw 'Measurement report empty' }
      - name: Restore fixture state and remove owned Sysmon
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/security/windows_bench_setup.ps1 -Cleanup
      - name: Preserve Windows measurement, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-detection-evidence
          path: |
            ${{ runner.temp }}/windows-live.json
            ${{ runner.temp }}/windows-live.txt
          retention-days: 14
